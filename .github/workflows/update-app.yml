name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - 'master'
      - 'main'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'
      - 'res/pinned_update.json'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and Update Discord PTB & Vencord
        id: update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const discordManifestUrl = 'https://discord.com/api/updates/distributions/app/manifests/latest?channel=ptb&platform=win&arch=x64';
            const vencordReleasesUrl = 'https://api.github.com/repos/Vendicated/Vencord/releases';

            function workspacePath(relativePath) {
              return path.join(process.env.GITHUB_WORKSPACE, relativePath);
            }

            function readFile(relativePath) {
              return fs.readFileSync(workspacePath(relativePath), 'utf8');
            }

            function writeFile(relativePath, content) {
              fs.writeFileSync(workspacePath(relativePath), content, 'utf8');
            }

            function propertyValue(content, name) {
              const pattern = new RegExp(`^${name.replaceAll('.', '\\.')}\\s*=\\s*(.+)$`, 'm');
              const match = content.match(pattern);
              return match ? match[1].trim() : null;
            }

            function replaceProperty(content, name, value) {
              const pattern = new RegExp(`^(${name.replaceAll('.', '\\.')}\\s*=\\s*).+$`, 'm');
              if (!pattern.test(content)) {
                return content + `\n${name} = ${value}`;
              }
              return content.replace(pattern, `$1${value}`);
            }

            function versionParts(version) {
              if (!/^\d+(?:\.\d+)*$/.test(version)) {
                throw new Error(`Invalid version: ${version}`);
              }
              return version.split('.').map(Number);
            }

            function compareVersions(left, right) {
              const leftParts = versionParts(left);
              const rightParts = versionParts(right);
              for (let i = 0; i < Math.max(leftParts.length, rightParts.length); i++) {
                const diff = (leftParts[i] || 0) - (rightParts[i] || 0);
                if (diff !== 0) return diff;
              }
              return 0;
            }

            // 1. Fetch Discord PTB Manifest
            core.info('Fetching latest Discord PTB manifest...');
            const discordResp = await fetch(discordManifestUrl, {
              headers: { 'accept': 'application/json', 'user-agent': 'discord-ptb-portable update-app' }
            });
            if (!discordResp.ok) {
              throw new Error(`Failed to fetch Discord manifest: ${discordResp.status}`);
            }
            const discordManifest = await discordResp.json();
            const latestDiscordVer = discordManifest.full.host_version.join('.');
            core.info(`Resolved latest Discord PTB version: ${latestDiscordVer}`);

            // 2. Fetch Vencord Release
            core.info('Fetching latest Vencord release...');
            const vencordResp = await fetch(vencordReleasesUrl, {
              headers: { 'accept': 'application/vnd.github+json', 'user-agent': 'discord-ptb-portable update-app' }
            });
            let latestVencordTag = 'devbuild';
            let vencordReleaseName = 'DevBuild';
            if (vencordResp.ok) {
              const vencordReleases = await vencordResp.json();
              if (Array.isArray(vencordReleases) && vencordReleases.length > 0) {
                const rel = vencordReleases.find(r => r.assets && r.assets.some(a => a.name === 'patcher.js')) || vencordReleases[0];
                latestVencordTag = rel.tag_name || 'devbuild';
                vencordReleaseName = rel.name || latestVencordTag;
              }
            }
            core.info(`Resolved latest Vencord tag: ${latestVencordTag} (${vencordReleaseName})`);

            // 3. Compare with build.properties
            const propertiesPath = 'build.properties';
            const manifestPath = 'res/pinned_update.json';
            const currentProperties = readFile(propertiesPath);
            const currentManifest = fs.existsSync(workspacePath(manifestPath)) ? readFile(manifestPath) : '';

            const currentDiscordVer = propertyValue(currentProperties, 'app.version') || '1.0.0';
            const currentRelease = Number(propertyValue(currentProperties, 'app.release') || '1');
            const currentVencordVer = propertyValue(currentProperties, 'vencord.version') || '';

            const discordVerDiff = compareVersions(latestDiscordVer, currentDiscordVer);
            if (discordVerDiff < 0) {
              core.warning(`Discord upstream version (${latestDiscordVer}) is older than current (${currentDiscordVer})`);
            }

            const discordChanged = discordVerDiff > 0;
            const vencordChanged = latestVencordTag !== currentVencordVer;
            const nextRelease = discordChanged ? currentRelease + 1 : currentRelease;

            let updatedProperties = currentProperties;
            if (discordChanged) {
              updatedProperties = replaceProperty(updatedProperties, 'app.version', latestDiscordVer);
              updatedProperties = replaceProperty(updatedProperties, 'app.release', String(nextRelease));
            }
            if (vencordChanged) {
              updatedProperties = replaceProperty(updatedProperties, 'vencord.version', latestVencordTag);
            }

            const normalizedManifest = `${JSON.stringify(discordManifest, null, 2)}\n`;
            const manifestChanged = normalizedManifest !== currentManifest;

            const hasChanges = discordChanged || vencordChanged || manifestChanged;

            if (hasChanges) {
              writeFile(propertiesPath, updatedProperties);
              writeFile(manifestPath, normalizedManifest);
              core.info('Updated build.properties and res/pinned_update.json');
            } else {
              core.info('Everything is up-to-date. No changes detected.');
            }

            const changeDesc = [];
            if (discordChanged) changeDesc.push(`Discord PTB ${latestDiscordVer}`);
            if (vencordChanged) changeDesc.push(`Vencord ${latestVencordTag}`);
            const commitTitle = changeDesc.length > 0 ? `chore(update): ${changeDesc.join(' & ')}` : `chore(update): refresh pinned manifest`;
            const tagName = `v${latestDiscordVer}-${nextRelease}`;

            core.setOutput('has_changes', String(hasChanges));
            core.setOutput('discord_changed', String(discordChanged));
            core.setOutput('vencord_changed', String(vencordChanged));
            core.setOutput('discord_version', latestDiscordVer);
            core.setOutput('next_release', String(nextRelease));
            core.setOutput('vencord_version', latestVencordTag);
            core.setOutput('tag_name', tagName);
            core.setOutput('commit_title', commitTitle);

      - name: Download Updated Vencord Assets
        if: steps.update.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          node scripts/setup_vencord.js

      - name: Commit and Push Tag
        if: steps.update.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add build.properties res/pinned_update.json res/vencord/
          git commit -m "${{ steps.update.outputs.commit_title }}"
          
          # Tag and push
          $tagName = "${{ steps.update.outputs.tag_name }}"
          Write-Host "Creating tag: $tagName"
          git tag $tagName
          git push origin HEAD
          git push origin $tagName

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for updates
        shell: pwsh
        run: |
          node -e "
          const https = require('https');
          https.get('https://discord.com/api/updates/distributions/app/manifests/latest?channel=ptb&platform=win&arch=x64', {
            headers: { 'User-Agent': 'discord-ptb-portable test' }
          }, res => {
            let d = '';
            res.on('data', c => d += c);
            res.on('end', () => {
              const j = JSON.parse(d);
              console.log('Latest Discord PTB host_version:', j.full.host_version);
            });
          });
          "
