<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord PTB - จัดการโปรไฟล์</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-light">
  <div class="window-container">
    <!-- Window Titlebar with Draggable Region -->
    <header class="window-titlebar" id="drag-region">
      <div class="titlebar-drag-handle">
        <div class="app-brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#5865F2">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
        </div>
        <span class="window-title-text" id="window-title-label">Discord PTB - จัดการโปรไฟล์</span>
      </div>
      <div class="window-controls-cluster">
        <button id="win-btn-minimize" class="win-btn win-btn-minimize" type="button" title="ย่อหน้าต่าง" aria-label="Minimize">
          <svg width="10" height="2" viewBox="0 0 10 2" fill="currentColor">
            <rect width="10" height="2" rx="1"/>
          </svg>
        </button>
        <button id="win-btn-close" class="win-btn win-btn-close" type="button" title="ปิด" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="1" y1="1" x2="9" y2="9"/>
            <line x1="9" y1="1" x2="1" y2="9"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="window-content">
      <!-- Section Header with Selection Controls -->
      <div class="card-layer palette-card">
        <div class="section-header-compact">
          <div class="header-text-group">
            <h2 class="section-title" id="header-title">เลือกโปรไฟล์สี</h2>
            <p class="section-subtitle" id="header-desc">เลือกสีประจำบัญชีเพื่อแยกไอคอนและข้อมูล</p>
          </div>
          <div class="selection-actions-group">
            <span id="selected-badge" class="badge-pill">เลือกแล้ว 0 บัญชี</span>
            <div class="selection-buttons-cluster">
              <button type="button" id="btn-select-all" class="btn-pill">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span>เลือกทั้งหมด</span>
              </button>
              <button type="button" id="btn-deselect-all" class="btn-pill">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span>ล้างการเลือก</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 12 Color Profiles Grid (3 columns x 4 rows) -->
        <div id="profiles-grid" class="profiles-grid"></div>
      </div>

      <!-- Notice Banner (Only shown in Uninstall mode when all are selected) -->
      <div id="uninstall-notice" class="uninstall-notice" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>การเลือกทั้งหมดจะทำการถอนการติดตั้งและลบไฟล์ทั้งหมดของ Discord Portable ออกจากเครื่อง</span>
      </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer class="window-footer">
      <div class="footer-action-row">
        <button type="button" id="btn-cancel" class="btn btn-secondary">
          <span>ยกเลิก</span>
        </button>
        <button type="button" id="btn-action" class="btn btn-primary">
          <span id="btn-action-text">ติดตั้ง</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
